<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
<div class="card shadow p-4" style="max-width: 400px; width: 100%;">
    <h3 class="text-center mb-4">Physio Expert Login</h3>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="disease" value="{{ disease or '' }}">
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" value="{{ email or '' }}" autocomplete="email" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <div class="input-group">
                <input type="password" id="password" name="password" class="form-control" autocomplete="current-password" required>
                <button type="button" class="btn btn-outline-secondary" id="togglePw" aria-label="Show password">Show</button>
            </div>
            <div class="text-end mt-1">
                <a href="{{ url_for('forgot_password') }}" class="text-decoration-none small text-primary">Forgot Password?</a>
            </div>
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
    <div class="text-center mt-3">
        <p>Don't have an account? <a href="/register">Register here</a></p>
    </div>
</div>
<script>
    document.getElementById('togglePw').addEventListener('click', function () {
        var i = document.getElementById('password');
        var show = i.type === 'password';
        i.type = show ? 'text' : 'password';
        this.textContent = show ? 'Hide' : 'Show';
    });
</script>
</body>
</html>
