<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register - PhysioExpert</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow p-4" style="width: 400px; max-width: 94vw;">
        <h3 class="text-center text-primary mb-4">Create Account</h3>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} text-center" role="alert">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <input type="hidden" name="disease" value="{{ disease or '' }}">
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" value="{{ email or '' }}" autocomplete="email" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <div class="input-group">
                    <input type="password" id="password" name="password" class="form-control" minlength="12" autocomplete="new-password" required>
                    <button type="button" class="btn btn-outline-secondary" id="togglePw" aria-label="Show password">Show</button>
                </div>
                <div class="form-text">At least 12 characters.</div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Start 30-Day Free Trial</button>
        </form>
        <div class="text-center mt-3"><a href="/login">Already have an account? Login</a></div>
    </div>
    <script>
        document.getElementById('togglePw').addEventListener('click', function () {
            var i = document.getElementById('password');
            var show = i.type === 'password';
            i.type = show ? 'text' : 'password';
            this.textContent = show ? 'Hide' : 'Show';
        });
    </script>
</body>
</html>
