
name: Staging Clinical Library Import

on:
  push:
    branches:
      - feature/exercise-images-staging
    paths:
      - scripts/clinical_import_mode.txt

permissions:
  contents: read

concurrency:
  group: staging-clinical-import
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/feature/exercise-images-staging'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: feature/exercise-images-staging

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify staging database target
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          from sqlalchemy.engine import make_url

          value = os.environ.get("DATABASE_URL")
          if not value:
              raise SystemExit("STAGING_DATABASE_URL is missing")

          url = make_url(value)

          if url.get_backend_name() != "postgresql":
              raise SystemExit("Only PostgreSQL is allowed")

          if url.database != "physioexpertpro_staging_db":
              raise SystemExit("Blocked: unexpected database name")

          print("Staging database target verified.")
          PY

      - name: Test actual database connection
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          value = os.environ.get("DATABASE_URL")
          if not value:
              raise SystemExit("Database URL is missing")

          engine = create_engine(
              value,
              connect_args={"connect_timeout": 10}
          )

          try:
              with engine.connect() as connection:
                  database = connection.execute(
                      text("SELECT current_database()")
                  ).scalar_one()

                  result = connection.execute(
                      text("SELECT 1")
                  ).scalar_one()

                  if database != "physioexpertpro_staging_db":
                      raise SystemExit("Blocked: connected to unexpected database")

                  if result != 1:
                      raise SystemExit("Database connection test failed")

                  print("Database connection successful.")
                  print("Verified staging database:", database)
          finally:
              engine.dispose()
          PY

      - name: Validate import mode
        id: mode
        run: |
          MODE="$(tr -d '[:space:]' < scripts/clinical_import_mode.txt)"

          if [ "$MODE" != "DRY_RUN" ] && [ "$MODE" != "APPLY" ]; then
            echo "Invalid import mode. Use DRY_RUN or APPLY."
            exit 1
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Import mode: $MODE"

      - name: Run dry validation
        if: steps.mode.outputs.mode == 'DRY_RUN'
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          CLINICAL_IMPORT_TARGET: staging
        run: |
          python scripts/import_clinical_library.py --confirm-staging

      - name: Apply clinical library to staging
        if: steps.mode.outputs.mode == 'APPLY'
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          CLINICAL_IMPORT_TARGET: staging
        run: |
          python scripts/import_clinical_library.py --confirm-staging --apply
